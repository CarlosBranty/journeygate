version = 1

[gateway]
url = "http://llm-gateway:4000"
master_key_env = "LITELLM_MASTER_KEY"
key_env = "GUARD_GATEWAY_KEY"
key_duration_secs = 7200
rpm_limit = 60
tpm_limit = 400000
max_parallel_requests = 2

[roles]
qa = "qa"
coder = "coder"

[agents.qa]
role = "qa"
runtime = "claude-code"
model = "claude-opus-5-5"
budget_usd = 2.0
max_attempts = 1

[agents.coder]
role = "coder"
runtime = "mini-swe-agent"
model = "openai/gpt-5"
budget_usd = 5.0
max_attempts = 3
timeout_secs = 1800

[agents.coder-copilot]
role = "coder"
runtime = "copilot-cli"
model = "anthropic/claude-sonnet-4-5"
via_gateway = true
budget_usd = 5.0

[scheduler]
host_slots = 4
daily_usd_cap = 50.0
provider_slots = { anthropic = 3, openai = 3 }
lease_secs = 300
image = "ghcr.io/acme/guard-sandbox@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[scheduler.best_of_n]
agents = ["coder", "coder-copilot"]
label = "agent-best-of-n"
select = "first_green_smallest_diff"
