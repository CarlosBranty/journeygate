[package]
name = "guard-agents"
description = "agents.toml, the Postgres task queue, the agent scheduler (slots, provider limits, daily USD cap, file conflicts, best-of-N), the per-ticket QA/Coder pipeline and the 'guard agents sync' renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.89"
futures = "=0.3.34"
guard-core = { path = "../guard-core" }
guard-store = { path = "../guard-store" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["process", "sync", "time"] }
toml = "=0.9.8"
url = "=2.5.7"

[dev-dependencies]
guard-core = { path = "../guard-core", features = ["fakes"] }
tempfile = "=3.23.0"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "test-util"] }
