[package]
name = "guard-map"
description = "guard_map: a token-budgeted repository map (personalized PageRank over a code graph) behind a backend-agnostic GraphSource trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
guard-core = { path = "../guard-core" }
guard-impact = { path = "../guard-impact" }
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
tracing = "=0.1.41"

[dev-dependencies]
tempfile = "=3.23.0"

[features]
# Exposes `guard_map::fake::FakeGraphSource` to downstream tests.
fakes = []
