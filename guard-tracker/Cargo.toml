[package]
name = "guard-tracker"
description = "IssueTracker adapter for Jira Cloud REST v3 plus the gate reporting use case (fingerprinted Bugs, ADF comments)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.89"
guard-core = { path = "../guard-core" }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
form_urlencoded = "=1.2.2"

[dev-dependencies]
guard-core = { path = "../guard-core", features = ["fakes"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
wiremock = "=0.6.5"
