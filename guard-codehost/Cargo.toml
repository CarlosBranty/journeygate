[package]
name = "guard-codehost"
description = "CodeHost adapters for GitHub and GitLab: PR context, check runs / commit statuses, PR comments, webhook verification and agent PR publishing (push + open PR / MR)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
guard-core = { path = "../guard-core" }
hex = "=0.4.3"
hmac = "=0.12.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["process", "time"] }

[dev-dependencies]
guard-core = { path = "../guard-core", features = ["fakes"] }
tempfile = "=3.23.0"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
wiremock = "=0.6.5"
