[package]
name = "guard-core"
description = "Pure domain logic of guard: config, catalog, routing, shard planning and verdicts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# In-memory fakes of every port (guard_core::ports::fakes) for adapter and server tests.
fakes = []

[dependencies]
async-trait = "=0.1.89"
globset = "=0.4.17"
regex = "=1.12.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
toml = "=0.9.8"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt"] }
