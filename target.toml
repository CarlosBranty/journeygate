# target.toml for the demo-shop reference app (docs/contracts/demo-app.md).
# Lives at the repository root: paths and the start command are repo-relative.
# `guard up` runs `start` in the background, writes its PID to .guard/app.pid
# and waits for GET base_url + ready_path = 200; `guard down` kills that PID.
version = 1

[app]
name = "demo-shop"
languages = ["javascript"]
start = "node examples/demo-shop/server.mjs"
base_url = "http://localhost:3000"
ready_path = "/healthz"

[testability]
token_env = "GUARD_TEST_TOKEN"
roles = ["customer"]

[areas.checkout]
description = "Cart, payment and order confirmation"
paths = ["examples/demo-shop/src/checkout/**", "examples/demo-shop/src/cart/**"]
sensitive = true

[areas.catalog]
description = "Product pages and stock display"
paths = ["examples/demo-shop/src/products/**"]

[areas.account]
description = "Test login, session and account page"
paths = ["examples/demo-shop/src/account/**"]
