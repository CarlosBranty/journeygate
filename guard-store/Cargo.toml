[package]
name = "guard-store"
description = "DecisionLog, GateHistory, flaky history and job queue on Postgres (sqlx) or in memory; EvidenceStore on S3-compatible storage (SigV4) or the local filesystem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.89"
guard-core = { path = "../guard-core" }
hex = "=0.4.3"
hmac = "=0.12.1"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls"] }
thiserror = "=2.0.17"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "=1.48.0", features = ["fs", "time"] }
url = "=2.5.7"

[dev-dependencies]
guard-core = { path = "../guard-core", features = ["fakes"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
wiremock = "=0.6.5"
