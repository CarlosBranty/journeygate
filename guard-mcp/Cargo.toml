[package]
name = "guard-mcp"
description = "guard mcp: a stdio MCP server exposing guard_affected, guard_test, guard_failure, guard_repro, guard_catalog, guard_history and guard_map."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.89"
guard-core = { path = "../guard-core" }
guard-map = { path = "../guard-map" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
guard-core = { path = "../guard-core", features = ["fakes"] }
guard-map = { path = "../guard-map", features = ["fakes"] }
jsonschema = { version = "=0.58.6", default-features = false }
tempfile = "=3.23.0"
tokio = { version = "=1.48.0", features = ["io-util", "macros", "rt-multi-thread", "test-util", "time"] }
