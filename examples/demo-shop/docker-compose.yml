# Runs demo-shop in a container: `docker compose up -d --wait` / `docker compose down -v`.
services:
  demo-shop:
    image: node:24.14.0-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./:/app:ro
    environment:
      PORT: "3000"
      NODE_ENV: development
      GUARD_TEST_TOKEN: ${GUARD_TEST_TOKEN:-demo-token}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
